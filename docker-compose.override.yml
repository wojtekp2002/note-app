services:
  web:
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - .:/app
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    command: flask --app app run --host=0.0.0.0 --port=5000 --debug

  adminer:
    image: adminer:latest
    container_name: note-app-adminer
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT}:8080"
